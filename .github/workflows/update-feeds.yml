name: Refresh AWS IP feeds

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  actions: write
  checks: read
  contents: write
  pull-requests: write

concurrency:
  group: refresh-aws-ip-feeds
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      BOT_BRANCH_PREFIX: automation/aws-feed-refresh
      EXPECTED_PR_TITLE: "chore: refresh AWS IP feeds"
      PR_MARKER: "<!-- aws-geoip-feed-refresh -->"
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: true

      - name: Generate feeds from authoritative AWS sources
        run: python3 scripts/generate_feeds.py

      - name: Validate generated feeds
        run: python3 scripts/validate_feeds.py feeds/ipv4

      - name: Detect feed changes
        id: changes
        shell: bash
        run: |
          git add feeds/ipv4
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No AWS feed changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Require repository auto-merge
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          AUTO_MERGE="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.allow_auto_merge')"
          if [[ "$AUTO_MERGE" != "true" ]]; then
            echo "::error::Repository auto-merge is disabled. Enable Settings > General > Pull Requests > Allow auto-merge."
            exit 1
          fi

      - name: Create feed refresh pull request
        id: pr
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          EXISTING_BRANCH="$(
            gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --state open \
              --base main \
              --limit 100 \
              --json headRefName \
              --jq '.[].headRefName' \
            | grep -E "^${BOT_BRANCH_PREFIX}-" \
            | head -n 1 \
            || true
          )"

          if [[ -n "$EXISTING_BRANCH" ]]; then
            echo "::error::An automated AWS feed refresh PR is already open from branch ${EXISTING_BRANCH}. Resolve it before another refresh is published."
            exit 1
          fi

          BOT_BRANCH="${BOT_BRANCH_PREFIX}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BOT_BRANCH"
          git commit -m "$EXPECTED_PR_TITLE"
          EXPECTED_SHA="$(git rev-parse HEAD)"
          git push --set-upstream origin "$BOT_BRANCH"

          PR_URL="$(
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$BOT_BRANCH" \
              --title "$EXPECTED_PR_TITLE" \
              --body-file - <<'PR_BODY'
          <!-- aws-geoip-feed-refresh -->
          Automated refresh of the generated AWS IPv4 feed files.

          - Sources: AWS `geo-ip-feed.csv` and `ip-ranges.json`
          - Generated by: `.github/workflows/update-feeds.yml`
          - Validation: `scripts/validate_feeds.py`
          - Merge policy: GitHub native auto-merge is enabled only after the required `CI / test` check succeeds on the exact automation commit and the feed-only PR contract is verified

          No source code, workflow, documentation, or repository settings are changed by this automated PR.
          PR_BODY
          )"

          PR_NUMBER="${PR_URL##*/}"
          echo "branch=$BOT_BRANCH" >> "$GITHUB_OUTPUT"
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "sha=$EXPECTED_SHA" >> "$GITHUB_OUTPUT"
          echo "Created automated feed refresh PR: $PR_URL"

      - name: Dispatch required CI for automation branch
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        env:
          BOT_BRANCH: ${{ steps.pr.outputs.branch }}
        run: |
          if [[ -z "$BOT_BRANCH" ]]; then
            echo "::error::Automation branch was not returned by the PR creation step."
            exit 1
          fi

          gh workflow run ci.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$BOT_BRANCH"

          echo "Dispatched CI for ${BOT_BRANCH}."

      - name: Wait for exact dispatched CI run
        id: ci
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        env:
          BOT_BRANCH: ${{ steps.pr.outputs.branch }}
          EXPECTED_SHA: ${{ steps.pr.outputs.sha }}
        run: |
          CI_RUN_ID=""

          for attempt in $(seq 1 30); do
            RUN_JSON="$(
              gh run list \
                --repo "$GITHUB_REPOSITORY" \
                --workflow ci.yml \
                --branch "$BOT_BRANCH" \
                --event workflow_dispatch \
                --limit 10 \
                --json databaseId,headSha,status,conclusion \
              | jq -c --arg sha "$EXPECTED_SHA" '[.[] | select(.headSha == $sha)][0] // empty'
            )"

            if [[ -n "$RUN_JSON" ]]; then
              CI_RUN_ID="$(jq -r '.databaseId' <<< "$RUN_JSON")"
              STATUS="$(jq -r '.status' <<< "$RUN_JSON")"
              CONCLUSION="$(jq -r '.conclusion // ""' <<< "$RUN_JSON")"

              if [[ "$STATUS" == "completed" ]]; then
                if [[ "$CONCLUSION" != "success" ]]; then
                  echo "::error::CI run ${CI_RUN_ID} completed with conclusion ${CONCLUSION}."
                  exit 1
                fi

                echo "run_id=$CI_RUN_ID" >> "$GITHUB_OUTPUT"
                echo "Validated CI run ${CI_RUN_ID} for ${EXPECTED_SHA}."
                exit 0
              fi
            fi

            sleep 10
          done

          echo "::error::Timed out waiting for dispatched CI on ${EXPECTED_SHA}."
          exit 1

      - name: Verify automated PR contract
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          BOT_BRANCH: ${{ steps.pr.outputs.branch }}
          EXPECTED_SHA: ${{ steps.pr.outputs.sha }}
        run: |
          PR_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"

          PR_TITLE="$(jq -r '.title' <<< "$PR_JSON")"
          PR_BODY="$(jq -r '.body // ""' <<< "$PR_JSON")"
          PR_AUTHOR="$(jq -r '.user.login' <<< "$PR_JSON")"
          PR_HEAD_BRANCH="$(jq -r '.head.ref' <<< "$PR_JSON")"
          PR_HEAD_SHA="$(jq -r '.head.sha' <<< "$PR_JSON")"
          PR_HEAD_REPO="$(jq -r '.head.repo.full_name' <<< "$PR_JSON")"
          PR_BASE="$(jq -r '.base.ref' <<< "$PR_JSON")"

          [[ "$PR_TITLE" == "$EXPECTED_PR_TITLE" ]] || { echo "::error::Unexpected PR title."; exit 1; }
          [[ "$PR_BODY" == *"$PR_MARKER"* ]] || { echo "::error::PR marker is missing."; exit 1; }
          [[ "$PR_AUTHOR" == "github-actions[bot]" ]] || { echo "::error::Unexpected PR author: ${PR_AUTHOR}."; exit 1; }
          [[ "$PR_HEAD_BRANCH" == "$BOT_BRANCH" ]] || { echo "::error::Unexpected PR head branch."; exit 1; }
          [[ "$PR_HEAD_SHA" == "$EXPECTED_SHA" ]] || { echo "::error::PR head SHA changed after CI."; exit 1; }
          [[ "$PR_HEAD_REPO" == "$GITHUB_REPOSITORY" ]] || { echo "::error::Unexpected PR head repository."; exit 1; }
          [[ "$PR_BASE" == "main" ]] || { echo "::error::Unexpected PR base branch."; exit 1; }

          FILES="$(
            gh api \
              --paginate \
              "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" \
              --jq '.[].filename'
          )"

          if [[ -z "$FILES" ]]; then
            echo "::error::Automated feed refresh PR contains no changed files."
            exit 1
          fi

          UNEXPECTED="$(grep -Ev '^feeds/ipv4/' <<< "$FILES" || true)"
          if [[ -n "$UNEXPECTED" ]]; then
            echo "::error::Automated PR contains files outside feeds/ipv4/:"
            echo "$UNEXPECTED"
            exit 1
          fi

          CHECK_JSON="$(gh api -H 'Accept: application/vnd.github+json' "repos/${GITHUB_REPOSITORY}/commits/${EXPECTED_SHA}/check-runs")"
          TEST_CHECK="$(
            jq -c '[.check_runs[] | select(.name == "test" and .app.slug == "github-actions" and .status == "completed" and .conclusion == "success")][0] // empty' \
              <<< "$CHECK_JSON"
          )"

          if [[ -z "$TEST_CHECK" ]]; then
            echo "::error::Required GitHub Actions check 'test' is not successful on ${EXPECTED_SHA}."
            exit 1
          fi

          echo "Automated PR contract and required check verified."

      - name: Enable protected auto-merge
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          EXPECTED_SHA: ${{ steps.pr.outputs.sha }}
        run: |
          gh pr merge "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --auto \
            --squash \
            --delete-branch \
            --match-head-commit "$EXPECTED_SHA"

          echo "Native auto-merge enabled for PR #${PR_NUMBER}."

      - name: Wait for protected auto-merge
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          EXPECTED_SHA: ${{ steps.pr.outputs.sha }}
        run: |
          for attempt in $(seq 1 30); do
            PR_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
            PR_STATE="$(jq -r '.state' <<< "$PR_JSON")"
            PR_MERGED="$(jq -r '.merged' <<< "$PR_JSON")"
            PR_HEAD_SHA="$(jq -r '.head.sha' <<< "$PR_JSON")"

            if [[ "$PR_HEAD_SHA" != "$EXPECTED_SHA" ]]; then
              echo "::error::PR head SHA changed while waiting for auto-merge."
              exit 1
            fi

            if [[ "$PR_MERGED" == "true" ]]; then
              echo "PR #${PR_NUMBER} merged through protected native auto-merge."
              exit 0
            fi

            if [[ "$PR_STATE" == "closed" ]]; then
              echo "::error::PR #${PR_NUMBER} closed without merging."
              exit 1
            fi

            sleep 10
          done

          echo "::error::Timed out waiting for protected auto-merge of PR #${PR_NUMBER}."
          exit 1

      - name: Dispatch and verify CI on updated main
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          MAIN_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')"

          gh workflow run ci.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main

          for attempt in $(seq 1 30); do
            RUN_JSON="$(
              gh run list \
                --repo "$GITHUB_REPOSITORY" \
                --workflow ci.yml \
                --branch main \
                --event workflow_dispatch \
                --limit 10 \
                --json databaseId,headSha,status,conclusion \
              | jq -c --arg sha "$MAIN_SHA" '[.[] | select(.headSha == $sha)][0] // empty'
            )"

            if [[ -n "$RUN_JSON" ]]; then
              RUN_ID="$(jq -r '.databaseId' <<< "$RUN_JSON")"
              STATUS="$(jq -r '.status' <<< "$RUN_JSON")"
              CONCLUSION="$(jq -r '.conclusion // ""' <<< "$RUN_JSON")"

              if [[ "$STATUS" == "completed" ]]; then
                if [[ "$CONCLUSION" != "success" ]]; then
                  echo "::error::Post-merge CI run ${RUN_ID} completed with conclusion ${CONCLUSION}."
                  exit 1
                fi

                echo "Post-merge CI run ${RUN_ID} succeeded on main SHA ${MAIN_SHA}."
                exit 0
              fi
            fi

            sleep 10
          done

          echo "::error::Timed out waiting for post-merge CI on ${MAIN_SHA}."
          exit 1
