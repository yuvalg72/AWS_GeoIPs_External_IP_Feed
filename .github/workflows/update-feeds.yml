name: Refresh AWS IP feeds

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: refresh-aws-ip-feeds
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      BOT_BRANCH_PREFIX: automation/aws-feed-refresh
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: true

      - name: Generate feeds from authoritative AWS sources
        run: python3 scripts/generate_feeds.py

      - name: Validate generated feeds
        run: python3 scripts/validate_feeds.py feeds/ipv4

      - name: Detect feed changes
        id: changes
        shell: bash
        run: |
          git add feeds/ipv4
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No AWS feed changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create feed refresh pull request
        id: pr
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          EXISTING_BRANCH="$(
            gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --state open \
              --base main \
              --limit 100 \
              --json headRefName \
              --jq '.[].headRefName' \
            | grep -E "^${BOT_BRANCH_PREFIX}-" \
            | head -n 1 \
            || true
          )"

          if [[ -n "$EXISTING_BRANCH" ]]; then
            echo "::error::An automated AWS feed refresh PR is already open from branch ${EXISTING_BRANCH}. Resolve it before another refresh is published."
            exit 1
          fi

          BOT_BRANCH="${BOT_BRANCH_PREFIX}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BOT_BRANCH"
          git commit -m "chore: refresh AWS IP feeds"
          git push --set-upstream origin "$BOT_BRANCH"

          PR_URL="$(
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$BOT_BRANCH" \
              --title "chore: refresh AWS IP feeds" \
              --body-file - <<'PR_BODY'
          <!-- aws-geoip-feed-refresh -->
          Automated refresh of the generated AWS IPv4 feed files.

          - Sources: AWS `geo-ip-feed.csv` and `ip-ranges.json`
          - Generated by: `.github/workflows/update-feeds.yml`
          - Validation: `scripts/validate_feeds.py`
          - Merge policy: only after the required `CI / test` check succeeds on the exact automation commit

          No source code, workflow, documentation, or repository settings are changed by this automated PR.
          PR_BODY
          )"

          PR_NUMBER="${PR_URL##*/}"
          echo "branch=$BOT_BRANCH" >> "$GITHUB_OUTPUT"
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Created automated feed refresh PR: $PR_URL"

      - name: Dispatch required CI for automation branch
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        env:
          BOT_BRANCH: ${{ steps.pr.outputs.branch }}
        run: |
          if [[ -z "$BOT_BRANCH" ]]; then
            echo "::error::Automation branch was not returned by the PR creation step."
            exit 1
          fi

          gh workflow run ci.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$BOT_BRANCH"

          echo "Dispatched CI for ${BOT_BRANCH}."
