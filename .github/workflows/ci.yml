name: CI

on:
  pull_request:
    paths-ignore:
      - "feeds/ipv4/**"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Validate committed feeds
        run: python3 scripts/validate_feeds.py feeds/ipv4
